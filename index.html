<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>NovaMart | Electronics Store</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<body>
<header class="navbar">

    <!-- TOP NAVBAR -->

    <div class="navbar-top">

        <!-- LOGO -->

        <div class="logo">
            <a href="#home">
                <img src="images/LOGO-DESIGN-01.png" alt="NovaMart Logo">
            </a>
        </div>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                placeholder="Search for products..."
            >

            <button type="button">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

        </div>


        <!-- NAV ACTIONS -->

        <div class="nav-actions">

            <a href="#" class="compare">
                <i class="fa-solid fa-code-compare"></i>
                <span>Compare</span>
            </a>

            <a href="#" class="wishlist">
                <i class="fa-solid fa-heart"></i>
                <span>Wishlist</span>
            </a>

            <a href="#" class="cart">

                <i class="fa-solid fa-cart-shopping"></i>

                <span>Cart</span>

                <small class="cart-count">0</small>

            </a>

        </div>

    </div>


    <!-- NAVIGATION -->

    <nav class="main-nav">

        <ul class="nav-links">

            <li>
                <a href="#home" class="active">Home</a>
            </li>

            <li>
                <a href="#products">Shop</a>
            </li>

            <li>
                <a href="#categories">
                    Categories
                    <i class="fa-solid fa-chevron-down"></i>
                </a>
            </li>

            <li>
                <a href="#offers">Deals</a>
            </li>

            <li>
                <a href="#reviews">About Us</a>
            </li>

            <li>
                <a href="#reviews">Contact Us</a>
            </li>

        </ul>

    </nav>


    <!-- MOBILE MENU BUTTON -->

    <button class="menu-toggle">
        <i class="fa-solid fa-bars"></i>
    </button>

</header>
